<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 530" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">검은 복도</title>
  <desc id="desc">칼날처럼 각진 한글 레터링. 검은은 은빛 금속, 복도는 어두운 붉은색.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="-18" x2="0" y2="209" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f2ede1"/><stop offset=".17" stop-color="#b8b7b0"/>
      <stop offset=".36" stop-color="#6c7273"/><stop offset=".45" stop-color="#34383d"/>
      <stop offset=".49" stop-color="#e4e1d7"/><stop offset=".56" stop-color="#c9c9c0"/>
      <stop offset=".74" stop-color="#858c8c"/><stop offset=".89" stop-color="#454b50"/>
      <stop offset="1" stop-color="#a5a6a0"/>
    </linearGradient>
    <linearGradient id="blood" x1="0" y1="-16" x2="35" y2="232" gradientUnits="userSpaceOnUse">

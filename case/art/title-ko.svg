  <g transform="translate(153 51) rotate(-5 200 100) scale(1.13 .91)">
    <use xlink:href="#geomeun" transform="translate(5 7)" fill="#030405" stroke="#030405" stroke-width="3"/>
    <use xlink:href="#geomeun" transform="translate(2 3)" fill="#555a5b" stroke="#96978e" stroke-width="1.3"/>
    <use xlink:href="#geomeun" fill="url(#silver)" stroke="url(#edge)" stroke-width="1.4" stroke-linejoin="miter"/>
    <path d="m31-1 78 0m40-6 25-12M37 111l131-3m-107 11 101-4M278 2l77-3m-127 113 173-5" stroke="#faf2e2" stroke-width="1.2" opacity=".63"/>

        M72 25 54 38 55 57 73 69 127 67 143 54 142 35 125 23Z
        M10 110 188 105 178 133 0 138Z
        M29 151 61 140 59 178 188 173 178 203 27 209Z"/>
    </g>
    <g id="bokdo" fill-rule="evenodd">
      <!-- 복 : ㅂ + ㅗ + ㄱ -->
      <path d="M18-2 51-15 50 23 137 20 138-3 171-17 167 88 17 95Z
        M49 46 48 69 137 65 137 43Z
        M84 108 116 97 115 123 190 119 180 146 1 152 10 126 84 124Z
